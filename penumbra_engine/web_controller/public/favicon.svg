<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      .shadow { fill: #87CEEB; }
      .face-left { fill: #A0A0A0; stroke: #000; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .face-right { fill: #909090; stroke: #000; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .face-bottom { fill: #787878; stroke: #000; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .hex-end { fill: #D0D0D0; stroke: #000; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .outline { fill: none; stroke: #000; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Blue Shadow Offset -->
  <polygon class="shadow" points="46,12 54,12 58,18 86,65 90,71 86,79 76,81 72,75 50,65 28,75 24,81 14,79 10,71 14,65 42,18" transform="translate(5, 7)" />

  <!-- 3 Main Faces -->
  <polygon class="face-left" points="50,52 50,22 42,18 14,65 24,67" />
  <polygon class="face-right" points="50,52 50,22 58,18 86,65 76,67" />
  <polygon class="face-bottom" points="50,52 24,67 28,75 50,65 72,75 76,67" />

  <!-- Hexagon Ends -->
  <polygon class="hex-end" points="50,22 58,18 54,12 46,12 42,18" />
  <polygon class="hex-end" points="76,67 86,65 90,71 86,79 76,81 72,75" />
  <polygon class="hex-end" points="24,67 14,65 10,71 14,79 24,81 28,75" />

  <!-- Thick Outer Silhouette Outline -->
  <polygon class="outline" points="46,12 54,12 58,18 86,65 90,71 86,79 76,81 72,75 50,65 28,75 24,81 14,79 10,71 14,65 42,18" />
</svg>
